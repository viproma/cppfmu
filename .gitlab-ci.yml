---
# Temporary: builds cppfmu from the karljohanreitesintef fork and uploads it to
# sintef-public until the package is provided upstream on GitHub.
#
#
variables:
  # Recorded in the recipe as the source of record; consumers building from source
  # clone it anonymously, so the pipeline commit must also be pushed to this fork.
  CPPFMU_SOURCE_URL: https://github.com/karljohanreitesintef/cppfmu.git

.conanprep:
  script:
    - pip install wheel setuptools conan~=2.0 --upgrade
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git config --global core.sshCommand 'ssh -i "$SSH_PRIVATE_KEY" -F /dev/null'
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - |
       if ($IsLinux) {
         chmod 400 "$SSH_PRIVATE_KEY"
         chmod 644 ~/.ssh/known_hosts
       }
    - $conan_config = "git@gitlab.sintef.no:marine-ict/base/conan-configs.git"
    - conan config install $conan_config --type git -sf conan2.0
    - conan config install $conan_config --type git -sf profiles -tf profiles
    - conan config install $conan_config --type git -sf remotes_all
    - conan remote disable sintef-private
    - $version = get-content -path ./version.txt
    - $channel = "testing"
    - if ($CI_COMMIT_TAG -contains "v$version") { $channel = "stable" }
    - 'write-host "Package: cppfmu/$version@sintef/$channel use_fmi_version=$FMI"'

.conanbuild:
  script:
    - conan create -o cppfmu/*:use_fmi_version=$FMI -b cppfmu/* -b missing -pr:b $PROFILE -pr:h $PROFILE -s:b build_type=$TYPE -s:h build_type=$TYPE . --user=sintef --channel=$channel

.conanupload:
  script:
    # Every job uploads the same recipe revision. When two race, the loser gets "400 File
    # name already exists"; a retry finds the recipe on the remote and uploads only the binary.
    - |
       foreach ($attempt in 1..3) {
         conan upload cppfmu/* -r sintef-public --confirm
         if ($LASTEXITCODE -eq 0) { break }
         Start-Sleep -Seconds (5 * $attempt)
       }
       if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

job:
  stage: build
  image: $DIMAGE
  tags:
    - MarineICT_${PLATFORM}_Build
  interruptible: true
  parallel:
    matrix:
      -
        PLATFORM: Windows
        TYPE: [Release, Debug]
        FMI: ["2", "3", "all"]
        PROFILE: ["msvc_192", "msvc_194"]
        DIMAGE: $WINDOWS_STABLE
      -
        PLATFORM: Linux
        TYPE: [Release, Debug]
        FMI: ["2", "3", "all"]
        PROFILE: ["gcc"]
        DIMAGE: [$DEBIAN_OLD_STABLE, $DEBIAN_STABLE]

  script:
    - !reference [.conanprep, script]
    - !reference [.conanbuild, script]
    - !reference [.conanupload, script]
